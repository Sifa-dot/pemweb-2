<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From.html</title>
</head>
<body>
    <style>
      * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d382f;
            color: white;
            padding: 40px 20px;
        }
        .container {
            max-width: 750px;
            margin: auto;
        }
        h1 {
            text-align: center;
            color: #80e6d2;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #b5d8d0;
            margin-bottom: 30px;
        }
        .form-box {
           background: linear-gradient(#0f4343, #3b7e85, #3ecebf);
            padding: 30px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #80e6d2;
            font-size: 14px;
        }
        .progress-bar {
            background: #315e53;
            height: 9px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .progress {
            width: 0%;
            height: 100%;
            background: #65cbb5;
            transition: 0.4s;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #80e6d2;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #347b6c;
            border-radius: 12px;
            background: #20594e;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #80e6d2;
            box-shadow: 0 0 8px rgba(128,230,210,0.2);
        }
        input::placeholder, textarea::placeholder {
            color: #b5d8d0;
        }
        select option {
            background: #164b40;
            color: white;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .radio-group label, .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            color: white;
        }
        .radio-group input, .checkbox-group input {
            width: auto;
            accent-color: #65cbb5;
        }
        input[type="file"] {
            padding: 10px;
        }
        #preview {
            display: none;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #65cbb5;
            margin-top: 15px;
        }
        button {
            width: 30%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #65cbb5;
            color: #103b32;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: white;
            transform: translateY(-3px);
        }
        .result {
            display: none;
            background: #20594e;
            border: 1px solid #65cbb5;
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            line-height: 1.8;
        }
        .result h3 {
            color: #80e6d2;
            margin-bottom: 10px;
        }
        .error {
            color: #ffb6a8;
            font-size: 13px;
            margin-top: 6px;
        }
        .back {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 12px 25px;
            background: #65cbb5;
            color: #103b32;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
        .back:hover {
            background: white;
        }
        .footer {
            text-align: center;
            color: #47807a;
            margin-top: 30px;
            padding: 20px;
            font-size: 14px;
        }
        @media (max-width: 600px) {
            .form-box {
                padding: 20px;
            }
            .radio-group, .checkbox-group {
                gap: 12px;
            }
        }
    </style>

<div class="container">
    <h1>Registrasi Siswa</h1>
    <p class="subtitle">Silakan Lengkapi Informasi Pribadi Anda</p>
    <div class="form-box">

      <div class="progress-info">
            <span>Form Progress</span>
            <span id="percent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

            <form id="studentForm">
            <div class="form-group">
            <label for="nama"> Nama Lengkap :</label>
            <input type="text" id="nama" name="nama" placeholder="Masukan Nama" required>
            </div>
    
            <div class="form-group">
            <label for="email"> Email :</label>
            <input type="email" id="email" name="email" placeholder="nama@gmail.com" required>
            </div>
    
            <div class="form-group">
            <label for="sandi"> Kata Sandi :</label>
            <input type="password" id="sandi" name="sandi" placeholder="***********" required>
            </div>

            <div class="form-group">
            <label for="umur"> Umur :</label>
            <input type="number" id="umur" name="umur" placeholder="Masukan Umur" required>
            </div>
            
            <div class="form-group">
            <label for="tanggal"> Tanggal Lahir :</label>
            <input type="date" id="tanggal" name="tanggal" required>
            </div>

            <div class="form-group">
            <label for="gender">Jenis Kelamin :</label>
            <div class="radio-group">
            <label >
            <input type="radio" id="Laki-laki" name="gender" value="Laki-laki" required>Laki-laki</label> 
            <label>
            <input type="radio" id="Perempuan" name="gender" value="Perempuan" required>Perempuan</label> 
            </div>
        </div>
    
    <div class="form-group">
    <label for="jurusan">Program Studi :</label>
    <select id="jurusan" name="jurusan" required>
        <option value="">-- Pilih --</option>
        <option value="tkj">Teknik Komputer Jaringan</option>
        <option value="rpl">Rekayasa Perangkat Lunak</option>
        <option value="SI">Sistem Informasi</option>
    </select>
    </div>

    <div class="form-group">
    <label for="hobi">Hobi :</label>
    <div class="checkbox-group">
    <label>
    <input type="checkbox" id="coding" name="hobi" value="coding" required>Coding</label>
    <label>
    <input type="checkbox" id="gaming" name="hobi" value="gaming" required>Gaming</label>
    <label>
    <input type="checkbox" id="olahraga" name="hobi" value="olahraga" required>Olahraga</label>
    </div>
    </div>
    
    <div class="form-group">
    <label for="Alamat">Alamat :</label>
    <textarea id="alamat" name="alamat" rows="4" cols="30" placeholder="Masukan Alamat Anda"></textarea>
    </div>

    <div class="form-group">
    <label for="foto">Upload Foto</label>
    <input type="file" id="foto" name="foto" accept="image/*">
    <img id="preview" alt="Preview foto">
    </div>

    <div class="form-group">
     <label for="website"> Website :</label>
    <input type="url" id="web" name="web" placeholder="https//example.com" required>
    </div>

    
    <button type="submit">Kirim</button>
    <button type="reset">Reset</button>
    <p id="error" class="error"></p>
        </form>
        
        <div class="result" id="result">
            <h3>✓ Data Berhasil Dikirim!</h3>
            <div id="resultContent"></div>
        </div>
    </div>
      <a href="index.html" class="back">
        ← Kembali ke Home
    </a>
</div>

<footer class="footer">
    <p>
        &copy; <span id="currentYear"></span>
        Personal Website Sifa Nurfariza
    </p>
</footer>

<script>
    const form = document.getElementById("studentForm");
    const inputs = form.querySelectorAll("input, select, textarea");
    const progress = document.getElementById("progress");
    const percent = document.getElementById("percent");
    
    function updateProgress() {
        let filled = 0;
        const fields = [
            document.getElementById("nama"),
            document.getElementById("email"),
            document.getElementById("sandi"),
            document.getElementById("umur"),
            document.getElementById("tanggal"),
            document.getElementById("jurusan"),
            document.getElementById("alamat"),
            document.getElementById("web"),
        ];
        fields.forEach(function(field) {
            if (field.value.trim() !== "") {
                filled++;
            }
        });
        if (form.querySelector('input[name="gender"]:checked')) {
            filled++;
        }
        if (form.querySelector('input[name="hobi"]:checked')) {
            filled++;
        }
        if (document.getElementById("foto").files.length > 0) {
            filled++;
        }
        let percentage = Math.round((filled / 11) * 100);
        progress.style.width = percentage + "%";
        percent.textContent = percentage + "%";
    }
    inputs.forEach(function(input) {
        input.addEventListener("input", updateProgress);
        input.addEventListener("change", updateProgress);
    });

    document.getElementById("foto").addEventListener("change", function() {
        const file = this.files[0];
        const preview = document.getElementById("preview");
        if (file) {
            if (!file.type.startsWith("image/")) {
                alert("Silakan pilih file gambar!");
                this.value = "";
                preview.style.display = "none";
                updateProgress();
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                preview.src = event.target.result;
                preview.style.display = "block";
            };
            reader.readAsDataURL(file);
        }
        updateProgress();
    });

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        const nama = document.getElementById("nama").value;
        const email = document.getElementById("email").value;
        const sandi = document.getElementById("sandi").value;
        const tanggal = document.getElementById("tanggal").value;
        const jurusan = document.getElementById("jurusan").value;
        const alamat = document.getElementById("alamat").value;
        const website = document.getElementById("web").value;
        const gender = document.querySelector(
            'input[name="gender"]:checked'
        ).value;
        const hobi = document.querySelectorAll(
            'input[name="hobi"]:checked'
        );
        let daftarHobi = [];
        hobi.forEach(function(item) {
            daftarHobi.push(item.value);
        });
        document.getElementById("error").textContent = "";
        document.getElementById("resultContent").innerHTML = `
            <p><b>Nama:</b> ${nama}</p>
            <p><b>Email:</b> ${email}</p>
            <p><b>Kata Sandi:</b> ${sandi}</p>
            <p><b>Tanggal Lahir:</b> ${tanggal}</p>
            <p><b>Jenis Kelamin:</b> ${gender}</p>
            <p><b>Program Studi:</b> ${jurusan}</p>
            <p><b>Web:</b> ${website || "Belum diisi"}</p>
            <p><b>Hobi:</b> ${daftarHobi.length ? daftarHobi.join(", ") : "Belum diisi"}</p>
            <p><b>Alamat:</b> ${alamat || "Belum diisi"}</p>
            
        `;
        document.getElementById("result").style.display = "block";
        document.getElementById("result").scrollIntoView({
            behavior: "smooth"
        });
    });
    
    document.getElementById("currentYear").textContent =
        new Date().getFullYear();
</script>
</body>
</html>
